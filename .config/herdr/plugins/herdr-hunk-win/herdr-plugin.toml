id = "herdr-hunk-win"
name = "herdr-hunk-win"
version = "0.1.0"
description = "Windows port of herdr-hunk: fzf picker for hunk diffs plus auto-open live diff when an agent goes idle."
min_herdr_version = "0.7.0"
platforms = ["windows"]

[[panes]]
id = "hunk-diff"
title = "hunk"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'scripts/hunk-diff.ps1')"]

# The picker script's path can't be relative here (it would resolve against
# the project --cwd, not the plugin root), so resolve via HERDR_PLUGIN_ROOT
# like hunk-diff above.
[[panes]]
id = "hunk-picker"
title = "hunk"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'scripts/picker.ps1')"]

[[actions]]
id = "open-hunk-picker"
title = "Hunk picker"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (split pane)."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-picker.ps1", "split"]

[[actions]]
id = "open-hunk-picker-tab"
title = "Hunk picker (tab)"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (own tab)."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-picker.ps1", "tab"]

[[actions]]
id = "open-hunk-watch"
title = "Hunk live diff"
description = "Toggle a live-reloading working-tree diff in a split pane (open / focus / close)."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-watch.ps1"]

[[actions]]
id = "toggle-autodiff"
title = "Toggle autodiff"
description = "Turn the agent-idle auto-open diff on or off (shows a toast with the new state)."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/toggle-autodiff.ps1"]

[[events]]
on = "pane.agent_status_changed"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/autodiff.ps1"]
