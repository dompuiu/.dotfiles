id = "herdr-hunk"
name = "herdr-hunk"
version = "0.2.0"
description = "fzf picker for hunk diffs plus auto-open live diff when an agent goes idle. zsh on Linux/macOS, pwsh on Windows."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos", "windows"]

# herdr rejects duplicate ids even when platforms differ, so Linux/macOS keep
# the upstream ids and Windows entries carry a "-win" suffix. Key bindings
# invoke the plain id and fall back to the "-win" one.
#
# Pane script paths can't be relative (they would resolve against the project
# --cwd, not the plugin root), so resolve via HERDR_PLUGIN_ROOT.

# --- Linux / macOS (zsh) ---------------------------------------------------

[[panes]]
id = "hunk-diff"
title = "hunk"
placement = "split"
platforms = ["linux", "macos"]
command = ["zsh", "-c", "exec zsh \"$HERDR_PLUGIN_ROOT/scripts/hunk-diff.zsh\""]

[[panes]]
id = "hunk-picker"
title = "hunk"
placement = "split"
platforms = ["linux", "macos"]
command = ["zsh", "-c", "exec zsh \"$HERDR_PLUGIN_ROOT/scripts/picker.zsh\""]

[[actions]]
id = "open-hunk-picker"
title = "Hunk picker"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (split pane)."
platforms = ["linux", "macos"]
command = ["zsh", "scripts/open-hunk-picker.zsh", "split"]

[[actions]]
id = "open-hunk-picker-tab"
title = "Hunk picker (tab)"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (own tab)."
platforms = ["linux", "macos"]
command = ["zsh", "scripts/open-hunk-picker.zsh", "tab"]

[[actions]]
id = "open-hunk-watch"
title = "Hunk live diff"
description = "Toggle a live-reloading working-tree diff in a split pane (open / focus / close)."
platforms = ["linux", "macos"]
command = ["zsh", "scripts/open-hunk-watch.zsh"]

[[actions]]
id = "toggle-autodiff"
title = "Toggle autodiff"
description = "Turn the agent-idle auto-open diff on or off (shows a toast with the new state)."
platforms = ["linux", "macos"]
command = ["zsh", "scripts/toggle-autodiff.zsh"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = ["zsh", "scripts/autodiff.zsh"]

# --- Windows (pwsh) --------------------------------------------------------

[[panes]]
id = "hunk-diff-win"
title = "hunk"
placement = "split"
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'scripts/hunk-diff.ps1')"]

[[panes]]
id = "hunk-picker-win"
title = "hunk"
placement = "split"
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'scripts/picker.ps1')"]

[[actions]]
id = "open-hunk-picker-win"
title = "Hunk picker"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (split pane)."
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-picker.ps1", "split"]

[[actions]]
id = "open-hunk-picker-tab-win"
title = "Hunk picker (tab)"
description = "fzf picker: working tree / staged / commit / range / stash, then view in hunk (own tab)."
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-picker.ps1", "tab"]

[[actions]]
id = "open-hunk-watch-win"
title = "Hunk live diff"
description = "Toggle a live-reloading working-tree diff in a split pane (open / focus / close)."
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-hunk-watch.ps1"]

[[actions]]
id = "toggle-autodiff-win"
title = "Toggle autodiff"
description = "Turn the agent-idle auto-open diff on or off (shows a toast with the new state)."
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/toggle-autodiff.ps1"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/autodiff.ps1"]
