# herdr config – keys ported from the old zellij + tmux setups
# Prefix is ctrl+z everywhere (zellij locked Ctrl+z -> normal, tmux prefix C-z).
onboarding = false

[ui]
mouse_capture = true

[keys]
prefix = "ctrl+z"

# Tabs: zellij normal c/n/p, tmux prefix c/n/p
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9" # zellij tab 1..9
rename_tab = "prefix+shift+t" # zellij tmux , (renametab)
close_tab = "prefix+shift+x" # zellij tab x

# Panes: zellij normal % (right) / " (down), tmux prefix % / "
split_vertical = ["prefix+%"]
split_horizontal = ["prefix+\""]
close_pane = "prefix+x" # zellij tmux/pane x
zoom = "prefix+z" # zellij normal Ctrl+z fullscreen
copy_mode = "prefix+["
edit_scrollback = "prefix+e"
swap_pane_left = "prefix+{"
swap_pane_right = "prefix+}"
cycle_pane_next = "prefix+tab"
open_notification_target = "prefix+alt+shift+o" # prefix+alt+o -> sesh picker

# Direct focus, no prefix: zellij locked Ctrl+h/j/k/l (navigator plugin).
# Note: shells/editors also see these; use prefix+h/j/k/l on conflict.
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

# Direct resize, no resize-mode: zellij locked Ctrl+Alt+h/j/k/l.
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"
resize_mode = "prefix+r"

# Sessions/workspaces: tmux-ish
detach = "prefix+q"
workspace_picker = "prefix+w"
goto = "prefix+shift+g"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
new_worktree = "prefix+shift+u"

# Agents: one-shot jumps (no persistent picker mode in herdr)
# prefix+a / prefix+shift+a belong to herdr-annotate (capture / copy context)
next_agent = "prefix+alt+n"
previous_agent = "prefix+alt+shift+n"

[[keys.command]]
key = "prefix+!"
type = "shell"
command = "tab_id=$(\"$HERDR_BIN_PATH\" pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus | jq -er '.result.move_result.created_tab.tab_id') && \"$HERDR_BIN_PATH\" tab focus \"$tab_id\""
description = "move pane to new tab"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "panes.nvim"
description = "nvim side pane"

[[keys.command]]
key = "prefix+alt+shift+v"
type = "plugin_action"
command = "panes.nvim-tab"
description = "nvim (tab)"


[[keys.command]] # tuicr in a split (commit / working tree selector)
key = "prefix+alt+i"
type = "plugin_action"
command = "panes.tuicr"

[[keys.command]] # tuicr in its own tab
key = "prefix+alt+shift+i"
type = "plugin_action"
command = "panes.tuicr-tab"

[[keys.command]] # tuicr review of uncommitted changes in a split (open / focus / close)
key = "prefix+alt+d"
type = "plugin_action"
command = "panes.tuicr-worktree"

[[keys.command]] # sesh picker: open workspaces / saved sessions / zoxide
key = "prefix+alt+o"
type = "shell"
command = "herdr plugin action invoke open-picker --plugin sesh || herdr plugin action invoke open-picker-win --plugin sesh"

[[keys.command]] # previous workspace
key = "prefix+;"
type = "shell"
command = "herdr plugin action invoke last --plugin sesh || herdr plugin action invoke last-win --plugin sesh"

[[keys.command]]
key = "prefix+alt+t"
type = "shell"
command = "herdr plugin action invoke open-board-windows --plugin herdr-tsk || herdr plugin action invoke open-board --plugin herdr-tsk"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"

# herdr-annotate (Windows Full install): annotate terminal text, review
# documents / agent replies, send the feedback back to the agent.
# prefix+a and prefix+shift+a were the agent jumps; they moved to alt+n.

[[keys.command]] # comment on the selected text (Ctrl+S saves)
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"

[[keys.command]] # copy all annotations as Markdown
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"

[[keys.command]] # copy all annotations, then archive them
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"

[[keys.command]] # paste annotations into the agent's prompt, archive them
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"

[[keys.command]] # send annotations to the agent as its next message, archive
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"

[[keys.command]] # manage annotations: jump to pane, edit, copy, archive
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"

[[keys.command]] # review documents in this folder (plannotator-tui)
key = "prefix+d"
type = "plugin_action"
command = "annotate.open"

[[keys.command]] # review the agent's recent replies
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"

[[keys.command]] # review the agent's newest reply, no picker
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"

[[keys.command]] # review this pane's recent output
key = "prefix+t"
type = "plugin_action"
command = "annotate.terminal"

[[keys.command]] # review this folder with an Approve button
key = "prefix+ctrl+d"
type = "plugin_action"
command = "annotate.gate"
